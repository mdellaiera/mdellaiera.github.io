  <body>
    <header>
      <nav>
        <a class="site-name" href="index.html">mdellaiera.github.io</a>

        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="about.html">About Me</a>

          <a class="active" href="gallery.html">Gallery</a>

    <main>
      <section>
        <h1>Gallery</h1>
        <p>
          This gallery includes research figures, fieldwork photos, diagrams,
          visualizations, posters, and selected project videos.
        </p>

        <h2>Photos</h2>

        <div class="gallery-grid">
          <figure class="gallery-card">
            <img src="images/gallery-1.jpg" alt="Research image 1" />
            <figcaption>Research image 1</figcaption>
          </figure>

          <figure class="gallery-card">
            <img src="images/gallery-2.jpg" alt="Research image 2" />
            <figcaption>Research image 2</figcaption>
          </figure>

          <figure class="gallery-card">
            <img src="images/gallery-3.jpg" alt="Research image 3" />
            <figcaption>Research image 3</figcaption>
          </figure>
        </div>

        <h2 class="section-subtitle">Videos</h2>

        <div class="video-grid">
          <article class="video-card">
            <video controls>
              <source src="videos/ctao1.mp4" type="video/mp4" />
              Your browser does not support the video tag.
            </video>
            <h3>CTAO LST-1</h3>
          </article>

          <article class="video-card">
            <video controls>
              <source src="videos/ctao2.mp4" type="video/mp4" />
              Your browser does not support the video tag.
            </video>
            <h3>CTAO LST-1 + MAGIC</h3>
          </article>

          <article class="video-card">
            <video controls>
              <source src="videos/ctao3.mp4" type="video/mp4" />
              Your browser does not support the video tag.
            </video>
            <h3>CTAO LST-1 + MAGIC</h3>
          </article>
        </div>
      </section>
    </main>
