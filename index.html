<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mdellaiera.github.io</title>
    <style>
      :root {
        --bg: #f7f9fc;
        --card: #ffffff;
        --text: #13233a;
        --muted: #55657a;
        --accent: #1769e0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Georgia, "Times New Roman", serif;
        color: var(--text);
        background:
          radial-gradient(circle at top right, #e6f0ff 0%, transparent 40%),
          radial-gradient(circle at bottom left, #ecf6ef 0%, transparent 45%),
          var(--bg);
      }

      main {
        width: min(92vw, 720px);
        padding: 2.5rem 2rem;
        border-radius: 16px;
        background: var(--card);
        box-shadow: 0 12px 32px rgba(19, 35, 58, 0.12);
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(1.8rem, 5vw, 2.8rem);
      }

      p {
        margin: 0;
        font-size: 1.05rem;
        line-height: 1.6;
        color: var(--muted);
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello from GitHub Pages</h1>
      <p>
        This is a minimal website for <strong>mdellaiera.github.io</strong>.
        Edit <code>index.html</code> in this repository to customize your page.
      </p>
    </main>
  </body>
</html>
